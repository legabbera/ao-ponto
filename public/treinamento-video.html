<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo de Treinamento Oficial (1920x1080) — Plataforma Ao Ponto</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Montserrat', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Container de Aspect Ratio Fixo 16:9 (Full HD nativo 1920x1080 escalonável) */
    .video-viewport {
      width: 1280px;
      height: 720px;
      max-width: 98vw;
      max-height: 55.125vw;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at 50% 25%, #1C1917 0%, #0C0A09 100%);
      border-radius: 16px;
      border: 2px solid #27272A;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform-origin: center center;
    }

    @media (min-width: 1600px) {
      .video-viewport {
        width: 1536px;
        height: 864px;
      }
    }

    /* Topo do Player */
    .video-header {
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(12, 10, 9, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .video-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .video-brand img {
      height: 32px;
      width: auto;
    }
    .video-brand-text {
      font-size: 20px;
      font-weight: 900;
      color: #EA580C;
      letter-spacing: -0.5px;
    }
    .video-brand-sub {
      font-size: 13px;
      color: #A1A1AA;
      font-weight: 600;
      border-left: 1.5px solid #3F3F46;
      padding-left: 10px;
      margin-left: 2px;
    }
    .video-header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .badge-fhd {
      background: #27272A;
      color: #F43F5E;
      border: 1px solid #3F3F46;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* Palco Central do Slide */
    .video-stage {
      flex: 1;
      padding: 28px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .slide-tag {
      font-size: 13px;
      font-weight: 800;
      color: #EA580C;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slide-title {
      font-size: 32px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 18px;
      line-height: 1.2;
    }

    .slide-content-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .slide-bullets {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(28, 25, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.35;
      color: #D4D4D8;
    }
    .bullet-item strong { color: #FFFFFF; font-weight: 800; }
    .bullet-icon { font-size: 20px; line-height: 1; }

    /* Mockup Visual no Vídeo */
    .slide-preview-box {
      background: #09090B;
      border: 1.5px solid #27272A;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.55);
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
      color: #A1A1AA;
      line-height: 1.45;
      max-height: 310px;
      overflow-y: auto;
    }
    .preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #18181B;
    }
    .circle { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .c-red { background: #EF4444; }
    .c-yellow { background: #F59E0B; }
    .c-green { background: #10B981; }

    /* Barra de Legendas Sincronizadas */
    .video-subtitles {
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 30px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #FEF08A;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }

    /* Barra de Controles Inferior */
    .video-controls {
      background: #0C0A09;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-top: 1px solid #1C1917;
      z-index: 10;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: #1C1917;
      border: 1px solid #27272A;
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-ctrl:hover {
      background: #27272A;
      border-color: #3F3F46;
    }
    .btn-ctrl.btn-destaque {
      background: #EA580C;
      border-color: #C2410C;
    }
    .btn-ctrl.btn-destaque:hover {
      background: #C2410C;
    }

    .timeline-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }
    .timeline-bar {
      flex: 1;
      height: 7px;
      background: #27272A;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .timeline-progress {
      width: 0%;
      height: 100%;
      background: #EA580C;
      transition: width 0.3s;
    }
    .time-display {
      font-size: 13px;
      font-family: 'Fira Code', monospace;
      color: #A1A1AA;
      min-width: 75px;
    }

    /* Modo Impressão / Roteiro em PDF */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      .video-header-right, .video-controls, .video-subtitles {
        display: none !important;
      }
      .video-viewport {
        width: 100% !important;
        height: auto !important;
        max-width: 100% !important;
        border: none !important;
        box-shadow: none !important;
        background: #FFFFFF !important;
      }
      .slide-preview-box {
        background: #F8FAFC !important;
        color: #0F172A !important;
        border: 1px solid #CBD5E1 !important;
      }
      .bullet-item {
        background: #F8FAFC !important;
        color: #0F172A !important;
        border: 1px solid #CBD5E1 !important;
      }
      .bullet-item strong {
        color: #000000 !important;
      }
      .slide-title {
        color: #9A3412 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Full HD Viewport -->

    <!-- Palco Central do Slide -->

        ],

    let slideAtual = 0;
    let tocando = false;
    let timer = null;
    let vozAtiva = true;

    function renderSlide() {
      const s = slides[slideAtual];
      const stage = document.getElementById('slide-stage');
      const subtitulo = document.getElementById('subtitles-box');
      const progressBar = document.getElementById('progress-bar');
      const timeDisplay = document.getElementById('time-display');

      stage.innerHTML = `
        <div class="slide-tag"><span>🔥</span> ${s.tag}</div>
        <div class="slide-title">${s.title}</div>
        <div class="slide-content-grid">
          <div class="slide-bullets">
            ${s.bullets.map(b => `
              <div class="bullet-item">
                <span class="bullet-icon">${b.icon}</span>
                <div>${b.text}</div>
              </div>
            `).join('')}
          </div>
          <div class="slide-preview-box">
            <div class="preview-header">
              <span class="circle c-red"></span>
              <span class="circle c-yellow"></span>
              <span class="circle c-green"></span>
              <span style="margin-left: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #FAFAFA;">Ao Ponto Sistema Operacional</span>
            </div>
            <pre style="white-space: pre-wrap; margin: 0; font-family: inherit;">${s.preview}</pre>
          </div>
        </div>
      `;

      subtitulo.textContent = s.legenda;
      progressBar.style.width = `${((slideAtual + 1) / slides.length) * 100}%`;
      const numAtual = (slideAtual + 1) < 10 ? `0${slideAtual + 1}` : `${slideAtual + 1}`;
      const numTotal = slides.length < 10 ? `0${slides.length}` : `${slides.length}`;
      timeDisplay.textContent = `${numAtual} / ${numTotal}`;

      if (vozAtiva) {
        falarTexto(s.legenda);
      }
    }

    function falarTexto(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(texto);
        utter.lang = 'pt-BR';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    function togglePlay() {
      tocando = !tocando;
      const btn = document.getElementById('btn-play');
      if (tocando) {
        btn.innerHTML = '⏸ Pausar Vídeo';
        btn.classList.remove('btn-destaque');
        iniciarAutoplay();
      } else {
        btn.innerHTML = '▶ Continuar Vídeo';
        btn.classList.add('btn-destaque');
        clearInterval(timer);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function iniciarAutoplay() {
      clearInterval(timer);
      renderSlide();
      timer = setInterval(() => {
        if (slideAtual < slides.length - 1) {
          slideAtual++;
          renderSlide();
        } else {
          slideAtual = 0;
          togglePlay();
        }
      }, 8500); // 8.5 segundos por slide
    }

    function nextSlide() {
      if (slideAtual < slides.length - 1) {
        slideAtual++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (slideAtual > 0) {
        slideAtual--;
        renderSlide();
      }
    }

    function seekVideo(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      slideAtual = Math.min(slides.length - 1, Math.max(0, Math.floor(pct * slides.length)));
      renderSlide();
    }

    function toggleVoz() {
      vozAtiva = !vozAtiva;
      document.getElementById('btn-voz').textContent = vozAtiva ? '🔊 Narração: ON' : '🔇 Narração: OFF';
      if (!vozAtiva && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      else if (vozAtiva) falarTexto(slides[slideAtual].legenda);
    }

    function toggleFullscreen() {
      const elem = document.getElementById('video-root') || document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          document.documentElement.requestFullscreen();
        });
      } else {
        document.exitFullscreen();
      }
    }

    function baixarRoteiroPDF() {
      window.print();
    }

    // Inicializa no primeiro slide
    renderSlide();
  </script>

</body>
</html>
