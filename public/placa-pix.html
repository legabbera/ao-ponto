<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Pix de Balcão — Ao Ponto</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Fira+Code:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brasa: #EA580C;
      --brasa-escura: #C2410C;
      --verde-pix: #0D9488;
      --carvao: #18181B;
      --creme: #FFFBF5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background: #F4F4F5;
      color: var(--carvao);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Barra Superior de Ações na Tela */
    .barra-acoes {
      width: 100%;
      max-width: 520px;
      background: #FFFFFF;
      border: 1.5px solid #E4E4E7;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s ease;
      border: none;
    }

    .btn-imprimir {
      background: #16A34A;
      color: #FFFFFF;
    }
    .btn-imprimir:hover { background: #15803D; }

    .btn-voltar {
      background: #F4F4F5;
      color: #3F3F46;
      border: 1px solid #D4D4D8;
    }
    .btn-voltar:hover { background: #E4E4E7; }

    /* Folha da Placa (A4 / Display) */
    .placa-folha {
      width: 100%;
      max-width: 500px;
      background: #FFFFFF;
      border: 5px solid var(--brasa);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      position: relative;
      box-sizing: border-box;
    }

    .placa-cabecalho {
      margin-bottom: 20px;
    }

    .logo-chama {
      font-size: 42px;
      display: block;
      margin-bottom: 6px;
    }

    .nome-ponto {
      font-size: 26px;
      font-weight: 900;
      color: var(--brasa-escura);
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .subtitulo-pix {
      font-size: 14px;
      font-weight: 800;
      color: #166534;
      background: #DCFCE7;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* Container do QR Code */
    .qr-container {
      width: 240px;
      height: 240px;
      margin: 18px auto;
      background: #FFFFFF;
      border: 2px solid #FED7AA;
      border-radius: 18px;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.08);
      padding: 12px;
    }

    .qr-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Caixa com a Chave */
    .chave-bloco {
      background: var(--creme);
      border: 2px dashed var(--brasa);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 18px 0 14px;
    }

    .chave-tipo {
      font-size: 11px;
      font-weight: 800;
      color: var(--brasa-escura);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    .chave-valor {
      font-family: 'Fira Code', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--carvao);
      word-break: break-all;
      display: block;
      letter-spacing: -0.3px;
    }

    .favorecido-linha {
      font-size: 13px;
      color: #52525B;
      margin-top: 6px;
      display: block;
    }

    .instrucao-rodape {
      font-size: 13.5px;
      font-weight: 700;
      color: #3F3F46;
      line-height: 1.4;
      margin-top: 14px;
    }

    .rodape-creditos {
      margin-top: 22px;
      font-size: 11px;
      color: #A1A1AA;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Regras Estritas de Impressão (A4) */
    @media print {
      body {
        background: #FFFFFF !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .barra-acoes, .no-print {
        display: none !important;
      }

      .placa-folha {
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
        border: 4px solid #C2410C !important;
        border-radius: 16px !important;
        padding: 30px 20px !important;
        page-break-inside: avoid;
      }

      .qr-container {
        border-color: #000 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de Ações Superior (Não sai na impressão) -->
  <div class="barra-acoes no-print">
    <a href="/#/pagamentos" class="btn btn-voltar">
      &larr; Voltar ao Sistema
    </a>
    <button class="btn btn-imprimir" onclick="window.print()">
      🖨️ Imprimir Placa de Balcão
    </button>
  </div>

  <!-- Folha Oficial da Placa -->
  <div class="placa-folha">
    <div class="placa-cabecalho">
      <span class="logo-chama">🍗</span>
      <h1 class="nome-ponto" id="placa-nome-ponto">Ao Ponto Assados</h1>
      <span class="subtitulo-pix">⚡ PAGAMENTO INSTANTÂNEO VIA PIX</span>
    </div>

    <!-- QR Code SVG Dinâmico -->
    <div class="qr-container">
      <svg viewBox="0 0 100 100" id="placa-svg-qr">
        <rect width="100" height="100" fill="white"/>
        <!-- Padrões de Alinhamento Pix -->
        <rect x="8" y="8" width="26" height="26" fill="#000"/>
        <rect x="13" y="13" width="16" height="16" fill="#fff"/>
        <rect x="16" y="16" width="10" height="10" fill="#000"/>

        <rect x="66" y="8" width="26" height="26" fill="#000"/>
        <rect x="71" y="13" width="16" height="16" fill="#fff"/>
        <rect x="74" y="16" width="10" height="10" fill="#000"/>

        <rect x="8" y="66" width="26" height="26" fill="#000"/>
        <rect x="13" y="71" width="16" height="16" fill="#fff"/>
        <rect x="16" y="74" width="10" height="10" fill="#000"/>

        <!-- Ícone Central Pix -->
        <rect x="40" y="40" width="20" height="20" fill="#EA580C" rx="4"/>
        <text x="50" y="55" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">⚡</text>

        <!-- Matriz de Pontos Simulada -->
        <rect x="40" y="12" width="7" height="7" fill="#000"/>
        <rect x="52" y="18" width="7" height="7" fill="#000"/>
        <rect x="43" y="27" width="6" height="6" fill="#000"/>
        <rect x="66" y="46" width="6" height="14" fill="#000"/>
        <rect x="76" y="52" width="15" height="6" fill="#000"/>
        <rect x="43" y="70" width="12" height="6" fill="#000"/>
        <rect x="60" y="70" width="10" height="16" fill="#000"/>
        <rect x="78" y="78" width="12" height="12" fill="#000"/>
      </svg>
    </div>

    <!-- Caixa da Chave Oficial -->
    <div class="chave-bloco">
      <span class="chave-tipo" id="placa-tipo-chave">Chave Pix (CNPJ)</span>
      <span class="chave-valor" id="placa-valor-chave">12.345.678/0001-90</span>
      <span class="favorecido-linha" id="placa-favorecido">Favorecido: <strong>Ao Ponto Assados Ltda</strong></span>
    </div>

    <p class="instrucao-rodape">
      Abra o aplicativo do seu banco, escolha <strong>Pix</strong> e aponte a câmera do celular para pagar na hora sem taxas!
    </p>

    <div class="rodape-creditos">
      Ao Ponto &bull; Gestão Profissional de Assados
    </div>
  </div>

  <script>
    // Recuperar dados dinâmicos do LocalStorage ou Sessão
    try {
      const sessaoStr = sessionStorage.getItem('fa-sessao');
      const pagamentosStr = localStorage.getItem('fa-pagamentos-config');
      
      let nomeLoja = 'Ao Ponto Assados';
      let chavePix = '12.345.678/0001-90';
      let tipoChave = 'CNPJ';
      let titular = 'Ao Ponto Assados Ltda';

      if (pagamentosStr) {
        const pag = JSON.parse(pagamentosStr);
        if (pag.pix) {
          if (pag.pix.chave) chavePix = pag.pix.chave;
          if (pag.pix.tipoChave) tipoChave = pag.pix.tipoChave.toUpperCase();
          if (pag.pix.titular) titular = pag.pix.titular;
        }
      }

      document.getElementById('placa-nome-ponto').textContent = nomeLoja;
      document.getElementById('placa-tipo-chave').textContent = 'Chave Pix (' + tipoChave + ')';
      document.getElementById('placa-valor-chave').textContent = chavePix;
      document.getElementById('placa-favorecido').innerHTML = 'Favorecido: <strong>' + titular + '</strong>';
    } catch (e) {
      console.warn('Erro ao carregar dados dinâmicos da placa:', e);
    }

    // Auto-impressão se tiver o parâmetro ?print=true
    if (window.location.search.includes('print=true')) {
      setTimeout(() => {
        window.print();
      }, 500);
    }
  </script>
</body>
</html>
